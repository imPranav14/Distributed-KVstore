syntax = "proto3";

package raft;

option go_package = "github.com/imPranav14/Distributed-KVstore/proto/raft;raftpb";

// Raft is the node-to-node consensus service. Distinct from kv.proto's
// KVStore service, which is client-facing — this one is only ever called
// by other Raft nodes.
service Raft {
    rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
    rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
    rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

// Every request carries group_id (Milestone 9b): one process hosts several
// Raft groups, one per shard, all served on the same port, and group_id is
// how the receiving process picks which group's Node handles the message.
//
// Group IDs start at 1. In proto3 an unset field reads as 0, so a sender
// that forgot to set group_id, or a binary from before sharding, sends
// group 0 — which matches no group and is rejected, instead of being
// handled by a real group it was never meant for.
//
// Responses carry no group_id: a reply returns on the same call as its
// request, so it cannot be delivered to the wrong group.

message RequestVoteRequest {
    uint64 term = 1;
    uint64 candidate_id = 2;
    // last_log_index/last_log_term are carried starting Milestone 5 even
    // though the log doesn't exist until Milestone 6 (both are always 0
    // until then) — see UNDERSTANDING.md's Milestone 5 entry, Design
    // Choice 3, for why this avoids reopening this RPC's signature later.
    uint64 last_log_index = 3;
    uint64 last_log_term = 4;
    uint64 group_id = 5;
}

message RequestVoteResponse {
    // The voter's own term. A candidate whose term is behind this value
    // must step down immediately, per the term rule: any node that ever
    // sees a higher term adopts it and reverts to follower.
    uint64 term = 1;
    bool vote_granted = 2;
}

message LogEntry {
    uint64 term = 1;
    uint64 index = 2;
    // command is opaque to Raft itself — encoding is a KV-layer concern
    // deferred to Milestones 6/7.
    bytes command = 3;
}

message AppendEntriesRequest {
    uint64 term = 1;
    uint64 leader_id = 2;
    uint64 prev_log_index = 3; // unused until Milestone 6
    uint64 prev_log_term = 4;  // unused until Milestone 6
    // Empty entries + this RPC being sent at all IS the heartbeat in
    // Milestone 5 — there is no separate heartbeat RPC.
    repeated LogEntry entries = 5;
    uint64 leader_commit = 6; // unused until Milestone 6
    uint64 group_id = 7;
}

message AppendEntriesResponse {
    uint64 term = 1;
    bool success = 2;
}

// InstallSnapshotRequest carries a leader's whole snapshot to a follower that
// needs entries the leader has already compacted away — the only way such a
// follower can catch up.
//
// Sent as ONE message. The Raft paper adds offset/done fields to stream a
// large snapshot in chunks; they are deliberately omitted here, which means a
// snapshot larger than gRPC's 4 MB default message limit cannot be sent.
message InstallSnapshotRequest {
    uint64 term = 1;
    uint64 leader_id = 2;
    uint64 last_included_index = 3;
    uint64 last_included_term = 4;
    bytes data = 5; // opaque to Raft: the state machine's encoded state
    uint64 group_id = 6;
}

message InstallSnapshotResponse {
    // The follower's term, so a stale leader learns it has been superseded.
    uint64 term = 1;
}
