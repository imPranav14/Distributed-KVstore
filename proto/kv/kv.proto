syntax = "proto3";

package kv;

option go_package = "github.com/imPranav14/Distributed-KVstore/proto/kv;kvpb";

// KVStore is the client-facing service. At this milestone each node serves
// requests against its own local store — no replication or consensus yet.
service KVStore {
    rpc Get(GetRequest) returns (GetResponse);
    rpc Put(PutRequest) returns (PutResponse);
    rpc Delete(DeleteRequest) returns (DeleteResponse);
}

// GetRequest has no client_id/request_id: Get is read-only and
// side-effect-free, so replaying it any number of times is always safe. It
// never goes through the server's dedup table.
message GetRequest {
    string key = 1;
}

message GetResponse {
    string value = 1;
    bool found = 2;
}

// INVARIANT: once a field number below is used in a released version of
// this file, it must never be reused for a different field, even if the
// field is renamed — protobuf's wire format identifies fields by number,
// not by name, and reusing a number breaks compatibility between old and
// new binaries reading the same bytes.

message PutRequest {
    string key = 1;
    string value = 2;
    string client_id = 3;
    uint64 request_id = 4;
}

// Empty: store.Store.Put has no return value, and gRPC's own status code
// (OK vs. error) is how the client learns whether the call succeeded.
message PutResponse {}

message DeleteRequest {
    string key = 1;
    string client_id = 2;
    uint64 request_id = 3;
}

// Empty, same reasoning as PutResponse.
message DeleteResponse {}

// Command is the payload of one replicated log entry: what the leader
// proposes and every replica applies to its state machine. It is NOT an RPC
// message — no service method takes or returns it.
//
// INVARIANT: these field numbers are permanent in a stricter sense than the
// RPC messages above. Commands live in a durable log that is replayed on
// every restart, forever. Renumbering a field would not merely break old
// clients — it would make every existing log decode into the wrong fields.
//
// Protobuf encoding is not canonical, which is why Milestone 6 hand-rolled
// the log's own framing. That concern does not apply here: a Command is
// marshalled exactly once, by the leader, and followers store and replay
// those identical bytes without ever re-encoding them.
message Command {
    enum Op {
        // INVARIANT: the zero value is never proposed. proto3 omits default
        // field values when marshalling, so a Command with Op=UNSPECIFIED
        // and every other field empty marshals to ZERO bytes — which is
        // exactly how Raft represents a no-op. Reserving 0 is what keeps
        // "empty command" and "real command" impossible to confuse.
        OP_UNSPECIFIED = 0;
        OP_PUT = 1;
        OP_DELETE = 2;
    }
    Op op = 1;
    string key = 2;
    string value = 3; // unused for OP_DELETE
    string client_id = 4;
    uint64 request_id = 5;
}

// KVSnapshot is the state machine's complete state, as stored in a Raft
// snapshot's opaque Data. Like Command, it is not an RPC message.
//
// INVARIANT: the dedup table is part of the snapshot, not just the KV map.
// A replica restored from a snapshot without it forgets which requests it
// has already applied; a retry whose first copy was folded into the
// snapshot and whose second copy is still in the log would then be applied
// again on THAT replica only — the other replicas skip it, and the cluster
// silently diverges (Milestone 7, interview Q4).
message KVSnapshot {
    map<string, string> data = 1;
    // client ID -> highest request ID applied for that client.
    map<string, uint64> last_request_by_client = 2;
}
