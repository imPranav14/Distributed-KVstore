services:
  node1:
    build: .
    environment:
      - NODE_ID=1
      - PEER_ADDRS=node2:50051,node3:50051
      - GRPC_PORT=50051
      - DATA_DIR=/data/node1
    volumes:
      - node1-data:/data/node1

  node2:
    build: .
    environment:
      - NODE_ID=2
      - PEER_ADDRS=node1:50051,node3:50051
      - GRPC_PORT=50051
      - DATA_DIR=/data/node2
    volumes:
      - node2-data:/data/node2

  node3:
    build: .
    environment:
      - NODE_ID=3
      - PEER_ADDRS=node1:50051,node2:50051
      - GRPC_PORT=50051
      - DATA_DIR=/data/node3
    volumes:
      - node3-data:/data/node3

volumes:
  node1-data:
  node2-data:
  node3-data:
